interface=wlan0
bind-dynamic
except-interface=lo
domain-needed
bogus-priv
dhcp-range=192.168.4.10,192.168.4.100,255.255.255.0,24h
dhcp-option=3,192.168.4.1
dhcp-option=6,192.168.4.1
# Captive-Portal-DNS: nur die Prüfadressen der Handys auf uns.
# Alle anderen Namen (z. B. video.gaestebuch.cloud) beantworten wir NICHT,
# damit das Handy sie über seine mobilen Daten auflöst und die Cloud-Seite
# dann zum Video auf dem Token (http://192.168.4.1/v/...) weiterleitet.
address=/captive.apple.com/192.168.4.1
address=/www.appleiphonecell.com/192.168.4.1
address=/www.itools.info/192.168.4.1
address=/www.ibook.info/192.168.4.1
address=/www.airport.us/192.168.4.1
address=/www.thinkdifferent.us/192.168.4.1
address=/connectivitycheck.gstatic.com/192.168.4.1
address=/connectivitycheck.android.com/192.168.4.1
address=/clients1.google.com/192.168.4.1
address=/clients3.google.com/192.168.4.1
address=/www.msftconnecttest.com/192.168.4.1
address=/www.msftncsi.com/192.168.4.1
address=/detectportal.firefox.com/192.168.4.1
address=/nmcheck.gnome.org/192.168.4.1
address=/token.local/192.168.4.1
no-resolv
log-queries
log-dhcp
